services:
  blockwart:
    build:
      context: .
      args:
        BLOCKWART_BUILD_REVISION: ${BLOCKWART_BUILD_REVISION:-unknown}
    environment:
      BLOCKWART_ENV: production
      BLOCKWART_DATABASE_URL: sqlite:////data/blockwart.sqlite3
      BLOCKWART_SECRET_REFERENCE: vaultwarden:Blockwart
      BLOCKWART_SCHEMA_OVERRIDES_PATH: /data/ui_schema_overrides.json
      BLOCKWART_AUTH_SERVICE_TOKEN_RATE_WINDOW_SECONDS: ${BLOCKWART_AUTH_SERVICE_TOKEN_RATE_WINDOW_SECONDS:-60}
      BLOCKWART_AUTH_SERVICE_TOKEN_GLOBAL_FAILURE_LIMIT: ${BLOCKWART_AUTH_SERVICE_TOKEN_GLOBAL_FAILURE_LIMIT:-300}
      BLOCKWART_AUTH_SERVICE_TOKEN_SOURCE_FAILURE_LIMIT: ${BLOCKWART_AUTH_SERVICE_TOKEN_SOURCE_FAILURE_LIMIT:-30}
      BLOCKWART_AUTH_SERVICE_TOKEN_FINGERPRINT_FAILURE_LIMIT: ${BLOCKWART_AUTH_SERVICE_TOKEN_FINGERPRINT_FAILURE_LIMIT:-10}
      BLOCKWART_AUTH_SERVICE_TOKEN_FAILURE_BUCKET_MAX_ROWS: ${BLOCKWART_AUTH_SERVICE_TOKEN_FAILURE_BUCKET_MAX_ROWS:-10000}
      BLOCKWART_AUTH_SERVICE_TOKEN_FAILURE_BUCKET_PRUNE_INTERVAL_SECONDS: ${BLOCKWART_AUTH_SERVICE_TOKEN_FAILURE_BUCKET_PRUNE_INTERVAL_SECONDS:-60}
      BLOCKWART_AUTH_TRUSTED_PROXY_CIDRS: ${BLOCKWART_AUTH_TRUSTED_PROXY_CIDRS:-}
      BLOCKWART_SQLITE_BUSY_TIMEOUT_MS: ${BLOCKWART_SQLITE_BUSY_TIMEOUT_MS:-5000}
      BLOCKWART_SQLITE_WAL_ENABLED: ${BLOCKWART_SQLITE_WAL_ENABLED:-true}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - /opt/blockwart-data:/data
    restart: unless-stopped
