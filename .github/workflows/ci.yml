name: build-and-contracts

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: blockwart
          POSTGRES_PASSWORD: blockwart
          POSTGRES_DB: blockwart
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U blockwart"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Report runner resource pressure
        run: |
          printf 'loadavg='
          cat /proc/loadavg
          for resource in cpu io memory; do
            if [ -r "/proc/pressure/$resource" ]; then
              printf 'pressure_%s=' "$resource"
              tr '\n' ' ' <"/proc/pressure/$resource"
              printf '\n'
            fi
          done
          df -h /
          docker info \
            --format 'docker_driver={{.Driver}} containers={{.Containers}} images={{.Images}}'

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install locked development environment
        run: python -m pip install --constraint requirements/dev.txt ".[dev]"

      - name: Verify dependency locks
        run: ./scripts/update-dependency-locks.sh --check

      - name: Verify workflow parity and syntax
        run: |
          cmp .gitea/workflows/ci.yml .github/workflows/ci.yml
          actionlint .gitea/workflows/ci.yml .github/workflows/ci.yml

      - name: Lint and compile
        run: |
          ruff check --no-cache .
          python -m compileall -q src tests scripts

      - name: Run test suite
        run: |
          export BLOCKWART_TEST_PG_URL="postgresql+psycopg2://blockwart:blockwart@localhost:5432/blockwart"
          pytest -q

      - name: Verify reviewed OpenAPI contract
        run: python scripts/update_openapi_contract.py --check

      - name: Smoke installed wheel outside repository
        run: ./scripts/ci/package-smoke.sh

      - name: Build container from locked dependencies
        run: |
          REVISION=$(git rev-parse HEAD)
          docker build \
            --build-arg "BLOCKWART_BUILD_REVISION=$REVISION" \
            --tag "blockwart-ci:$REVISION" \
            .

      - name: Smoke empty and migrated container databases
        run: |
          REVISION=$(git rev-parse HEAD)
          ./scripts/ci/container-smoke.sh "blockwart-ci:$REVISION" "$REVISION"
