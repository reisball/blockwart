[build-system]
requires = ["setuptools==83.0.0", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "blockwart"
version = "0.1.0"
description = "Infrastructure knowledge and credential-reference platform."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13",
  "fastapi>=0.115",
  "jinja2>=3.1",
  "jsonschema>=4.20",
  "mcp>=1.28.1,<2",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "PyYAML>=6.0",
  "python-multipart>=0.0.9",
  "sqlalchemy>=2.0",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
  "actionlint-py>=1.7.12.24",
  "build>=1.5",
  "httpx>=0.27",
  "pip<26.2",
  "pip-tools==7.6.0",
  "pytest>=8.2",
  "ruff>=0.6",
  "setuptools==83.0.0",
  "wheel==0.47.0",
]

[project.scripts]
blockwart-db = "blockwart.cli.database:main"
blockwart-start = "blockwart.cli.start:main"
blockwart-mcp = "blockwart.mcp.server:main"
blockwart-import-markdown = "blockwart.cli.import_markdown:main"
blockwart-seed = "blockwart.cli.seed:main"
blockwart-schema-overrides = "blockwart.cli.schema_overrides:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
blockwart = [
  "migrations/env.py",
  "migrations/versions/*.py",
  "ui/templates/*.html",
  "ui/static/*.css",
  "ui/static/*.js",
  "ui/locales/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["blockwart"]
known-third-party = ["alembic"]
