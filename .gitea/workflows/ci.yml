name: build-and-contracts

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked development environment
        run: python -m pip install --constraint requirements/dev.txt ".[dev]"

      - name: Verify dependency locks
        run: ./scripts/update-dependency-locks.sh --check

      - name: Lint and compile
        run: |
          ruff check --no-cache .
          python -m compileall -q src tests scripts
          actionlint .gitea/workflows/ci.yml

      - name: Run test suite
        run: pytest -q

      - name: Verify reviewed OpenAPI contract
        run: python scripts/update_openapi_contract.py --check

      - name: Smoke installed wheel outside repository
        run: ./scripts/ci/package-smoke.sh

      - name: Build container from locked dependencies
        run: |
          REVISION=$(git rev-parse HEAD)
          docker build \
            --build-arg "BLOCKWART_BUILD_REVISION=$REVISION" \
            --tag "blockwart-ci:$REVISION" \
            .

      - name: Smoke empty and migrated container databases
        run: |
          REVISION=$(git rev-parse HEAD)
          ./scripts/ci/container-smoke.sh "blockwart-ci:$REVISION" "$REVISION"
