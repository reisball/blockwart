{% if can_write %}
  <form class="admin-control" method="post" action="/admin/lock">
    <button class="button button-small button-muted" type="submit">{{ t("admin.lock") }}</button>
  </form>
{% else %}
  <a class="admin-control button button-small button-muted" href="/admin">{{ t("admin.unlock") }}</a>
{% endif %}
