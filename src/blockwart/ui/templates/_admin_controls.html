{% if can_write %}
  <form class="admin-control" method="post" action="/admin/lock">
    <button class="button button-small button-muted" type="submit">{% if t is defined %}{{ t("admin.lock") }}{% else %}Admin sperren{% endif %}</button>
  </form>
{% else %}
  <a class="button button-small button-muted" href="/admin">{% if t is defined %}{{ t("admin.unlock") }}{% else %}Admin freigeben{% endif %}</a>
{% endif %}
