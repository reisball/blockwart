<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ title }}</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f6f7f9;
        color: #181b20;
      }
      body {
        margin: 0;
      }
      main {
        max-width: 960px;
        margin: 0 auto;
        padding: 48px 24px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 32px;
        line-height: 1.15;
      }
      p {
        margin: 0 0 24px;
        color: #535b66;
      }
      .panel {
        border: 1px solid #d9dde3;
        background: #fff;
        border-radius: 8px;
        padding: 20px;
      }
      code {
        background: #eef1f5;
        border-radius: 4px;
        padding: 2px 5px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Blockwart</h1>
      <p>Strukturierte Infrastruktur-Doku, Credential-Referenzen und agentenlesbare Betriebsdaten.</p>
      <section class="panel">
        <p>API-Health: <code>/api/health</code></p>
        <p>Catalog API: <code>/api/objects</code></p>
      </section>
    </main>
  </body>
</html>
