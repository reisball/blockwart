<!doctype html><html lang="{{ locale }}"><head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>{{ t('search.smart') }} - Blockwart</title><link rel="stylesheet" href="/static/app.css?v=ux5-polish1" />{% include '_navigation_head.html' %}</head><body class="ux-primary">
{% include '_main_navigation.html' %}
<main class="page stack"><h1>{{ t('search.smart') }}</h1><form class="panel search-fallback-form" action="/search" method="get"><label>{{ t('search.submit') }}<input type="search" name="q" value="{{ q }}" maxlength="200" /></label><label>{{ t('search.scope') }}<select name="object_kind"><option value="">{{ t('search.all_types') }}</option>{% for value in object_kinds %}<option value="{{ value }}" {% if object_kind == value %}selected{% endif %}>{{ t('kind.' ~ value) }}</option>{% endfor %}</select></label><p class="meta">{{ t('search.scope_help') }}</p><button>{{ t('search.submit') }}</button></form><div class="panel palette-results">{% include '_smart_search_results.html' %}</div></main></body></html>
